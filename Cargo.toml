[package]
name = "flux"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
feed-rs = "3.0.0"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
gstreamer = "0.25"
image-webp = "0.2.4"
quick-xml = "0.42"
relm4 = { version = "0.11", features = ["libadwaita", "gnome_50"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rustypipe = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "io-util"] }
url = "2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net"] }
